services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_PORT=4000
      - MONGODB_URI=${MONGODB_URI}
      - SESSION_SECRET=${SESSION_SECRET}
      - LLM_PROVIDER=groq
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL_HEAVY=${GROQ_MODEL_HEAVY:-openai/gpt-oss-120b}
      - GROQ_MODEL_LIGHT=${GROQ_MODEL_LIGHT:-openai/gpt-oss-20b}
