services:
  - type: web
    name: prepkit
    runtime: docker
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL_HEAVY
        value: openai/gpt-oss-120b
      - key: GROQ_MODEL_LIGHT
        value: openai/gpt-oss-20b
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
